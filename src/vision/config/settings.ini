[camera]
index = 6
width = 640
height = 480
fps = 30
flip_vertical = false

[detection]
roi_top_ratio = 0.00
roi_bottom_ratio = 1.00
roi_left_ratio = 0.00
roi_right_ratio = 1.00
n_bands = 3

[curve]
min_points_for_poly = 3

[yolo]
model = /home/rnd/line_ball_hurdle_grasp_extra-2/weights/best.engine
conf = 0.35
line_conf = 0.35
# 라인 판단과 별개로 화면에는 이 값보다 큰 라인만 표시한다.
line_display_conf = 0.35
ball_conf = 0.35
# 실제 공을 검출한 뒤 잠깐 놓치면 마지막 공 상태를 이 시간 동안 유지한다.
ball_detection_hold_seconds = 0.5
hurdle_conf = 0.35
imgsz = 640
device = 0
line_class = line
ball_class = ball
hurdle_class = hurdle

[raw_ball_in_hand]
# 화면 BALL 패널의 실제 계산값(표시 반올림 전)을 모두 만족하면 true이다.
# 모든 범위가 이 시간 동안 끊김 없이 유지되어야 true가 된다.
hold_seconds = 0.15
angle_min_deg = -65.0
angle_max_deg = -50.0
x_min_px = -310.0
x_max_px = -250.0
y_min_px = 130.0
y_max_px = 210.0

[visibility]
# If 30% or more of the object is cut/hidden, require at least 70% visible.
min_visible_ratio = 0.70
# YOLO boxes are usually clipped to the frame, so this rejects selected objects touching image borders.
reject_edge_cut_objects = false
edge_margin = 3
# 공과 허들 모두 화면 경계에 닿아도 검출 결과를 유지한다.
partial_filter_classes =

[output]
# vision_stack만 실행해도 웹캠 YOLO 결과 창을 표시한다.
show_window = true
save_video =
print_every_n_frames = 5
publish_hurdle_result = false

[realsense_yolo]
model = /home/rnd/realsense_hardcase_best.engine
conf = 0.35
# 진단 후보는 0.10부터 수집하되 실제 공 인정 기준(ball_conf)은 유지한다.
ball_diagnostic_conf = 0.10
backboard_conf = 0.35
ball_conf = 0.35
imgsz = 640
device = 0
max_fps = 30

goal_class = goal
backboard_class = backboard
ball_class = ball

depth_scale = 0.001
depth_min_m = 0.08
depth_max_m = 3.0
depth_inner_ratio_ball = 0.45
depth_inner_ratio_hoop = 0.30
min_valid_depth_pixels = 5

publish_debug_image = true
print_every_n_frames = 10
ball_loss_log_interval_seconds = 1.0
